<script>
(function(){
  const slot = document.querySelector('[data-tg-preview-slot][data-preview-kind="chat"]');
  if (!slot) return;
  const layout = document.getElementById('settings-layout')
    || document.querySelector('.settings-layout.can-preview');
  const gate = slot.querySelector('[data-tg-preview-gate]');
  const panel = slot.querySelector('[data-tg-preview-panel]');
  const openBtn = slot.querySelector('[data-tg-preview-open]');
  const closeBtn = slot.querySelector('[data-tg-preview-close]');
  const form = document.getElementById('settings-form') || document.getElementById('menu-form');
  const tab = {{ tab|tojson }};
  const values = {{ values|tojson }};
  const titleEl = document.getElementById('pv-title');
  const textEl = document.getElementById('pv-text');
  const keysEl = document.getElementById('pv-keys');
  const inlineEl = document.getElementById('pv-inline');
  const sceneEl = document.getElementById('pv-scene');
  const qrCard = document.getElementById('pv-qr');
  const qrCap = document.getElementById('pv-qr-cap');
  const qrBox = document.getElementById('pv-qr-box');
  const qrBg = document.getElementById('pv-qr-bg');
  const qrFake = document.getElementById('pv-qr-fake');
  let focusKey = null;
  let focusStyleId = null;
  let qrObjectUrl = null;
  let active = false;
  let renderTimer = 0;
  let menuObserver = null;
  const REMOVED_MENU = {guide:1, faq:1, restart:1, help:1};
  const DEBOUNCE_MS = 180;

  function val(name, fallback){
    if (!form) return (values[name] || fallback || '');
    const el = form.querySelector('[name="s_'+name+'"]');
    if (!el) return (values[name] || fallback || '');
    if (el.type === 'checkbox') return el.checked ? '1' : '0';
    if (el.type === 'file') return (values[name] || fallback || '');
    return el.value;
  }
  function qrBackgroundUrl(){
    const fileInput = form && form.querySelector('input[type="file"][name="s_qr_background"]');
    if (fileInput && fileInput.files && fileInput.files[0]) {
      if (!qrObjectUrl) qrObjectUrl = URL.createObjectURL(fileInput.files[0]);
      return qrObjectUrl;
    }
    const saved = (values.qr_background || '').trim();
    if (saved) return '/media/' + saved.replace(/^\/+/, '');
    return '';
  }
  function applyQrBackground(){
    const url = qrBackgroundUrl();
    if (qrBg) {
      if (url) {
        qrBg.src = url;
        qrBg.hidden = false;
        if (qrBox) qrBox.classList.add('has-bg');
        if (qrFake) qrFake.hidden = true;
      } else {
        qrBg.removeAttribute('src');
        qrBg.hidden = true;
        if (qrBox) qrBox.classList.remove('has-bg');
        if (qrFake) qrFake.hidden = false;
      }
    }
  }
  function esc(s){
    return String(s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  }
  function styleTone(id, fallback){
    var key = 'btn_style_' + id;
    var raw;
    if (form) {
      var el = form.querySelector('[name="s_' + key + '"]');
      if (el) raw = el.value;
    }
    if (raw === undefined || raw === null) {
      if (Object.prototype.hasOwnProperty.call(values, key)) raw = values[key];
      else raw = (fallback === undefined || fallback === null) ? '' : fallback;
    }
    var t = String(raw || '').trim().toLowerCase();
    if (t === 'primary' || t === 'success' || t === 'danger') return t;
    return 'default';
  }
  function btn(label, tone, opts){
    opts = opts || {};
    const t = tone || 'default';
    const sid = opts.styleId ? ' data-style-id="'+esc(opts.styleId)+'"' : '';
    const focus = opts.focus ? ' is-focus' : '';
    return '<button type="button" class="tg-key'+focus+'" data-tone="'+esc(t)+'"'+sid+'>'+esc(label)+'</button>';
  }
  function menuOrder(){
    const mo = document.getElementById('menu_order');
    const raw = (mo && mo.value)
      ? mo.value
      : String(values.menu_order || 'shop,services,wallet,support,loyalty,reseller_apply,miniapp');
    return raw.split(',').map(s => s.trim() === 'referral' ? 'loyalty' : s.trim()).filter(k => k && !REMOVED_MENU[k] && k !== 'referral');
  }
  function menuLayout(){
    const sel = document.getElementById('menu_layout_select')
      || (form && form.querySelector('[name="s_menu_layout"]'))
      || document.getElementById('menu_layout')
      || document.getElementById('menu_layout_ui');
    if (sel && sel.value) return sel.value;
    return values.menu_layout || 'compact';
  }
  function fillVars(text){
    return String(text||'')
      .replaceAll('{user_name}','کاربر')
      .replaceAll('{name}','کاربر')
      .replaceAll('{shop_title}', val('shop_title','کلاک بات'))
      .replaceAll('{user_id}','123456789')
      .replaceAll('{username}','@user')
      .replaceAll('{order_id}','1024')
      .replaceAll('{plan_name}','پلن نمونه')
      .replaceAll('{amount}','۵۰٬۰۰۰ تومان')
      .replaceAll('{payment_id}','88')
      .replaceAll('{gateway_name}','درگاه')
      .replaceAll('{code}','CLK42')
      .replaceAll('{link}','https://t.me/example_bot?start=CLK42')
      .replaceAll('{card}','6037-****-****-1234')
      .replaceAll('{holder}','نام دارنده')
      .replaceAll('{asset}','USDT')
      .replaceAll('{network}','TRC20')
      .replaceAll('{address}','TXyz…')
      .replaceAll('{url}','https://example.com/sub/demo')
      .replaceAll('{sub_link}','https://example.com/sub/demo')
      .replaceAll('{channels}','• @channel')
      .replaceAll('{admin_name}','علی')
      .replaceAll('{period_label}','روزانه')
      .replaceAll('{day}','۲۹')
      .replaceAll('{month_name}','مرداد')
      .replaceAll('{year}','۱۴۰۵')
      .replaceAll('{date_from}','۱۴۰۵/۵/۲۹')
      .replaceAll('{date_to}','۱۴۰۵/۵/۳۰')
      .replaceAll('{users_new}','۳')
      .replaceAll('{orders_new}','۵')
      .replaceAll('{orders_delivered}','۴')
      .replaceAll('{revenue_today}','۱٬۲۰۰٬۰۰۰ تومان')
      .replaceAll('{services_new}','۴')
      .replaceAll('{pending}','۲')
      .replaceAll('{tickets_open}','۱')
      .replaceAll('{failures}','۰')
      .replaceAll('{funnel_pay_start}','۸')
      .replaceAll('{funnel_receipt}','۶')
      .replaceAll('{funnel_delivered}','۵')
      .replaceAll('{users_total}','۱۲۰')
      .replaceAll('{orders_total}','۸۰')
      .replaceAll('{services_total}','۷۵')
      .replaceAll('{revenue_total}','۱۲٬۰۰۰٬۰۰۰ تومان')
      .replaceAll('{resellers_active}','۴');
  }
  function fillDailyReport(text){
    var t = String(text||'');
    var boxes = form ? form.querySelectorAll('input[type="checkbox"][name^="m_"]') : [];
    boxes.forEach(function(box){
      var key = (box.getAttribute('name')||'').replace(/^m_/, '');
      if (!key) return;
      var token = '{'+key+'}';
      if (!box.checked) t = t.split(token).join('');
    });
    return fillVars(t);
  }
  function renderReplyKeys(items, opts){
    if (!keysEl) return;
    opts = opts || {};
    const norm = (items || []).map(function(it){
      if (typeof it === 'string') return {label: it, tone: 'default'};
      return {
        label: it.label,
        tone: it.tone || 'default',
        styleId: it.styleId || '',
      };
    }).filter(function(it){ return it.label; });
    const home = val('btn_menu_home', values.btn_menu_home || '🏠 منوی اصلی');
    const back = val('btn_back', values.btn_back || '⬅️ بازگشت');
    const homeTone = styleTone('home', '');
    const backTone = styleTone('back', '');
    const compact = menuLayout() === 'compact';
    let html = '';
    if (compact) {
      for (let i=0;i<norm.length;i+=2){
        html += '<div class="tg-key-row">'
          + btn(norm[i].label, norm[i].tone, {styleId: norm[i].styleId, focus: norm[i].styleId === focusStyleId})
          + (norm[i+1] ? btn(norm[i+1].label, norm[i+1].tone, {styleId: norm[i+1].styleId, focus: norm[i+1].styleId === focusStyleId}) : '')
          + '</div>';
      }
    } else {
      html = norm.map(function(it){
        return '<div class="tg-key-row">'+btn(it.label, it.tone, {styleId: it.styleId, focus: it.styleId === focusStyleId})+'</div>';
      }).join('');
    }
    function navMode(){
      const sel = document.getElementById('nav_mode_select');
      if (sel && sel.value) return sel.value;
      const hid = document.getElementById('nav_mode_hidden');
      if (hid && hid.value) return hid.value;
      return values.nav_mode || 'inline';
    }
    const inlineNav = navMode() !== 'classic';
    if (opts.submenu && !inlineNav) {
      html += '<div class="tg-key-row tg-key-nav">'
        + btn(back, backTone, {styleId: 'back', focus: focusStyleId === 'back'})
        + btn(home, homeTone, {styleId: 'home', focus: focusStyleId === 'home'})
        + '</div>';
    } else if (home && !inlineNav) {
      html += '<div class="tg-key-row tg-key-home">'+btn(home, homeTone, {styleId: 'home', focus: focusStyleId === 'home'})+'</div>';
    }
    keysEl.innerHTML = html;
  }
  function render(){
    if (!active) return;
    const shop = val('shop_title','کلاک بات');
    if (titleEl) titleEl.textContent = shop || 'کلاک بات';
    let text = '';
    let showQr = false;
    let showKeys = false;
    if (tab === 'welcome') {
      text = fillVars(val('welcome_text','سلام {name} 👋'));
      showKeys = true;
    } else if (tab === 'messages') {
      const map = {
        s_guide_text: 'guide_text',
        s_faq_text: 'faq_text',
        s_empty_services_text: 'empty_services_text',
        s_shop_empty_text: 'shop_empty_text',
        s_delivery_title: 'delivery_title',
        s_purchase_success_text: 'purchase_success_text',
        s_wallet_success_text: 'wallet_success_text',
      };
      const key = map[focusKey] || 'purchase_success_text';
      if (key === 'delivery_title') {
        text = fillVars(val('delivery_title','✅ سرویس آماده است')) + '\n\n' +
          fillVars(val('purchase_success_text','پرداخت تأیید شد'));
      } else {
        text = fillVars(val(key, values[key] || 'متن پیام…'));
      }
    } else if (tab === 'buttons' || tab === 'menu') {
      text = fillVars(values.welcome_text || val('welcome_text','سلام {name} 👋'));
      showKeys = true;
    } else if (tab === 'qr') {
      text = fillVars(val('purchase_success_text','سرویس فعال شد.'));
      showQr = val('qr_enabled','1') === '1';
      let cap = fillVars(val('qr_caption','QR اشتراک'));
      if (val('show_sub_link_in_text','1')==='1') {
        cap += '\n\n🔗 https://example.com/sub/demo\n📦 ۱۰ گیگ · 📅 ۳۰ روز';
      }
      if (qrCap) qrCap.textContent = cap;
      applyQrBackground();
    } else if (tab === 'daily_report') {
      var defTpl = '📊 گزارش روزانه\n\n👤 ادمین: {admin_name}\n📅 دوره: {period_label}\n📆 روز: {day}\n🗓️ ماه: {month_name}\n📅 سال: {year}\n📅 از: {date_from}\n📅 تا: {date_to}\n\n📊 فعالیت:\n• کاربران جدید: {users_new}\n• سفارش‌ها: {orders_new}\n• تحویل‌شده: {orders_delivered}\n• درآمد امروز: {revenue_today}';
      text = fillDailyReport(val('admin_daily_report_template', values.admin_daily_report_template || defTpl));
      const hint = document.getElementById('pv-hint');
      if (hint) hint.textContent = 'پیش‌نمایش گزارش روزانه — با خاموش کردن آمار، مقدار آن در پیش‌نمایش خالی می‌شود.';
    }
    if (showKeys) {
      const order = menuOrder();
      const map = {
        shop: values.btn_shop || '🟢🛒 خرید سرویس',
        services: values.btn_services || '🔵📦 سرویس‌های من',
        wallet: values.btn_wallet || '🟡👛 کیف پول',
        support: values.btn_support || '🟣🎧 پشتیبانی',
        loyalty: values.btn_loyalty || '⭐ باشگاه مشتریان',
        referral: values.btn_loyalty || values.btn_referral || '⭐ باشگاه مشتریان',
        reseller_apply: values.btn_reseller_apply || '🤝 درخواست نمایندگی',
        miniapp: values.btn_miniapp || '📱 مینی‌اپ',
      };
      if (tab === 'buttons') {
        map.shop = val('btn_shop', map.shop);
        map.services = val('btn_services', map.services);
        map.wallet = val('btn_wallet', map.wallet);
        map.support = val('btn_support', map.support);
        map.loyalty = val('btn_loyalty', map.loyalty);
        map.referral = map.loyalty;
        map.reseller_apply = val('btn_reseller_apply', map.reseller_apply);
        map.miniapp = val('btn_miniapp', map.miniapp);
      }
      const styleMap = {
        shop: 'shop',
        services: 'services',
        wallet: 'wallet',
        support: 'support',
        loyalty: 'loyalty',
        referral: 'loyalty',
        reseller_apply: 'reseller_apply',
      };
      const defaults = {
        shop: 'primary', services: 'primary', wallet: 'primary',
        support: 'primary', loyalty: 'success', reseller_apply: '',
        miniapp: 'primary',
      };
      const inlineNavPreview = (function(){
        const sel = document.getElementById('nav_mode_select');
        if (sel && sel.value) return sel.value !== 'classic';
        const hid = document.getElementById('nav_mode_hidden');
        if (hid && hid.value) return hid.value !== 'classic';
        return (values.nav_mode || 'inline') !== 'classic';
      })();
      const labels = order.filter(function(k){
        if (inlineNavPreview) {
          // Mini App on reply KB; reseller_apply moves to welcome/support inline
          if (k === 'reseller_apply') return false;
          return true;
        }
        // Classic: Mini App was a separate inline bubble, not reply KB
        return k !== 'miniapp';
      }).map(function(k){
        const label = map[k];
        if (!label) return null;
        const sid = styleMap[k] || k;
        return {label: label, tone: styleTone(sid, defaults[sid] || ''), styleId: sid};
      }).filter(Boolean);
      renderReplyKeys(labels);
    } else if (keysEl) {
      keysEl.innerHTML = '';
    }
    if (inlineEl) {
      inlineEl.hidden = true;
      inlineEl.innerHTML = '';
    }
    if (sceneEl) sceneEl.hidden = true;
    if (textEl) textEl.innerHTML = esc(text).replace(/\n/g,'<br>');
    if (qrCard) qrCard.hidden = !showQr;
  }
  function scheduleRender(){
    if (!active) return;
    if (renderTimer) clearTimeout(renderTimer);
    renderTimer = window.setTimeout(function(){
      renderTimer = 0;
      render();
    }, DEBOUNCE_MS);
  }
  function onFocusIn(e){
    if (!active) return;
    const t = e.target;
    if (t && t.name) {
      focusKey = t.name;
      scheduleRender();
    }
  }
  function onQrFileChange(){
    if (qrObjectUrl) { URL.revokeObjectURL(qrObjectUrl); qrObjectUrl = null; }
    scheduleRender();
  }
  function bindLive(){
    if (form) {
      form.addEventListener('input', scheduleRender);
      form.addEventListener('change', scheduleRender);
      form.addEventListener('focusin', onFocusIn);
      const qrFile = form.querySelector('input[type="file"][name="s_qr_background"]');
      if (qrFile) qrFile.addEventListener('change', onQrFileChange);
    }
    const mo = document.getElementById('menu_order');
    if (mo) mo.addEventListener('change', scheduleRender);
    const ml = document.getElementById('menu_layout')
      || document.getElementById('menu_layout_select')
      || document.getElementById('menu_layout_ui');
    if (ml) ml.addEventListener('change', scheduleRender);
    const activeList = document.getElementById('active-list');
    if (activeList && window.MutationObserver) {
      menuObserver = new MutationObserver(scheduleRender);
      menuObserver.observe(activeList, {childList:true, subtree:true});
    }
  }
  function unbindLive(){
    if (form) {
      form.removeEventListener('input', scheduleRender);
      form.removeEventListener('change', scheduleRender);
      form.removeEventListener('focusin', onFocusIn);
      const qrFile = form.querySelector('input[type="file"][name="s_qr_background"]');
      if (qrFile) qrFile.removeEventListener('change', onQrFileChange);
    }
    const mo = document.getElementById('menu_order');
    if (mo) mo.removeEventListener('change', scheduleRender);
    const ml = document.getElementById('menu_layout')
      || document.getElementById('menu_layout_select')
      || document.getElementById('menu_layout_ui');
    if (ml) ml.removeEventListener('change', scheduleRender);
    if (menuObserver) {
      menuObserver.disconnect();
      menuObserver = null;
    }
    if (renderTimer) {
      clearTimeout(renderTimer);
      renderTimer = 0;
    }
  }
  function openPreview(){
    if (active) return;
    active = true;
    if (gate) gate.hidden = true;
    if (panel) panel.hidden = false;
    if (layout) layout.classList.add('has-preview');
    bindLive();
    render();
  }
  function closePreview(){
    if (!active) return;
    active = false;
    unbindLive();
    if (panel) panel.hidden = true;
    if (gate) gate.hidden = false;
    if (layout) layout.classList.remove('has-preview');
  }
  if (openBtn) openBtn.addEventListener('click', openPreview);
  if (closeBtn) closeBtn.addEventListener('click', closePreview);
})();
</script>
