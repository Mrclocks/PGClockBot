<!DOCTYPE html>
<html lang="fa" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark light" />
  <title>مینی‌اپ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preload" href="/static/fonts/Vazirmatn-Variable.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/static/fonts.css?v={{ app_version }}" />
  <link rel="stylesheet" href="/static/miniapp.css?v={{ app_version }}&brand=4" />
</head>
<body>
  <div id="ptr" class="ptr" aria-hidden="true">
    <svg focusable="false" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 0 0-14.5-4.5L4 8"/><path d="M4 4v4h4"/><path d="M4 13a8 8 0 0 0 14.5 4.5L20 16"/><path d="M20 20v-4h-4"/></svg>
  </div>
  <main id="root" class="ma-root" aria-live="polite"></main>
  <nav id="nav" class="tabbar" aria-label="منوی مینی‌اپ"></nav>
  <div id="sheet" class="sheet" hidden>
    <button type="button" class="sheet-backdrop" data-action="close-sheet" aria-label="بستن" tabindex="-1"></button>
    <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <header class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" id="sheet-close" class="icon-btn" data-action="close-sheet" aria-label="بستن">
          <svg aria-hidden="true" focusable="false" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </header>
      <div id="sheet-body" class="sheet-body"></div>
    </section>
  </div>
  <script src="/static/catalog_price.js?v={{ app_version }}&discounts=1" defer></script>
  <script src="/static/miniapp/core.js?v={{ app_version }}&brand=4" defer></script>
  <script src="/static/miniapp/render.js?v={{ app_version }}&brand=4" defer></script>
  <script src="/static/miniapp/pull.js?v={{ app_version }}&brand=4" defer></script>
  <script src="/static/miniapp/app.js?v={{ app_version }}&discounts=1&brand=4" defer></script>

</html>
