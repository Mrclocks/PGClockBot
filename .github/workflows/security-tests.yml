name: Security regression tests

# Runs the curated security/tenant-isolation/authz/secret-handling regression
# suite on every push and pull request, so a future patch can never silently
# reintroduce one of the issues fixed in the 2026-08 security audit.
#
# The full test suite (tests/) is intentionally NOT run here — it also
# contains a long tail of pre-existing, unrelated UI/version-pin tests that
# would make this signal noisy. See scripts/security_test_manifest.txt for
# the curated file list and scripts/run_security_tests.sh for the runner.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  security-tests:
    runs-on: ubuntu-latest
    # Database tests run against a real PostgreSQL server (tests/postgres_support.py).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: pgclock_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/pgclock_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run curated security regression suite
        run: bash scripts/run_security_tests.sh

  # PostgreSQL is the only supported database: see scripts/postgres_only_check.py.
  postgres-only:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Block new references to other database engines
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/postgres_only_check.py "origin/$BASE_REF"

  # The installer runs the panel on Python 3.10–3.12: newer-only code must not ship.
  oldest-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Compile every module and import the app
        env:
          # Importing builds the engine but opens no connection; no server is needed.
          DATABASE_URL: "postgresql+asyncpg://pgclock:import-check@127.0.0.1:5432/pgclock"
        run: |
          python -m compileall -q app alembic scripts run.py
          python -c "import app.main, app.bot, app.api.app"

      - name: Python compatibility tests
        run: python -m pytest tests/test_py_compat.py -q -p no:cacheprovider
